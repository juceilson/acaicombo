spring.application.name=acaicombo
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/acaicombo}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#logging.level.org.hibernate.orm.connections.pooling=warn
logging.level.org.hibernate=warn

# usuário do banco de dados
spring.datasource.username=${DB_USERNAME:acaicombo-app}
spring.datasource.password=${DB_PASSWORD:senha-app}

# admin padrão inicial
app.default-admin.username=${DEFAULT_ADMIN_NAME:admin}
app.default-admin.password=${DEFAULT_ADMIN_PASSWORD:passadmin}

