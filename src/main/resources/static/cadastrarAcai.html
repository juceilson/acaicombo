<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Açaí</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32x32.png">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous">
    <link rel="stylesheet" href="/css/cadastrarAcai.css">

</head>

<body class="bg-light d-flex flex-column min-vh-100">
<!-- Navbar padrão -->
<nav class="navbar navbar-expand-lg navbar-dark bg-violet">
    <div class="container">
        <a class="navbar-brand" href="/">AçaíCombo</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a href="#" class="nav-link" onclick="baixarRelatorioPDF(event)">Relatório</a></li>
                <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                <li class="nav-item"><a class="nav-link link-warning">Cadastrar Açaí</a></li>
                <li class="nav-item"><a class="nav-link" href="listarAcais.html">Listar Açaís</a></li>
                <li class="nav-item"><a class="nav-link" href="cadastrarUsuario.html">Cadastrar Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="listarUsuarios.html">Listar Usuários</a></li>
                <li class="nav-item"><a class="nav-link" href="/auth/logout">Sair</a></li>
            </ul>
        </div>
    </div>
</nav>


<!-- Formulário -->
<main class="flex-grow-1 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4 cadastrar-acai-form">
        <h3 class="text-center mb-4">Montar Açaí</h3>
        <form method="POST" id="acaiForm">
            <div class="d-flex flex-column flex-md-row justify-content-center gap-3 mt-4">
                <div class="w-100">
                    <div class="mb-3">
                        <label for="nome" class="form-label">Nome do Combo</label>
                        <input type="text" class="form-control" name="nome" id="nome" placeholder="Açaí Tradicional" required>
                    </div>

                    <div class="d-flex flex-row gap-3">
                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço</label>
                            <input type="number" class="form-control" name="preco" id="preco" value="7.99" step="1" required>
                        </div>

                        <div class="mb-3">
                            <label for="volume" class="form-label">Volume do Açaí</label>
                            <input type="text" class="form-control" id="volume" name="volume" list="volume-options"
                                    placeholder="ex.: 700ml"required />
                            <datalist id="volume-options">
                                <option value="250ml"></option>
                                <option value="350ml"></option>
                                <option value="500ml"></option>
                            </datalist>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="descricao" class="form-label">Descrição dos adicionais</label>
                        <input type="text" class="form-control" name="descricao" id="descricao" list="descricao-options"
                               placeholder="Açaí, Granola, " required>
                        <datalist id="descricao-options">
                            <option value="Açaí, Granola, Banana"></option>
                            <option value="Açaí, Granola, Morango"></option>
                            <option value="Açaí, Granola, Leite condençado"></option>
                        </datalist>
                    </div>

                    <div class="d-flex flex-row gap-3">
                        <div class="mb-3 flex-grow-1 ">
                            <label for="img_url" class="form-label">URL/caminho da imagem</label>
                            <input type="text" class="form-control" name="img_url" id="img_url" list="url-options"
                                    placeholder="/img/acai-tradicional.png" required/>
                            <datalist id="url-options">
                                <option value="/img/acai-tradicional.png"></option>
                                <option value="/img/acai-fitness.png"></option>
                                <option value="/img/acai-familia.png"></option>
                            </datalist>
                        </div>
                        <div class="mb-3">
                            <img id="img_preview" src="/img/acai-tradicional.png" alt="Prévia do açaí" width="64" />
                        </div>
                    </div>
                </div>
            </div>

            <div class="d-grid mt-2">
                <button type="submit" class="btn btn-success">Cadastrar Açaí</button>
            </div>
        </form>
    </div>
</main>

<footer class="text-center text-muted py-3 mt-auto">
    &copy; 2026 AçaíCombo. Todos os direitos reservados.
</footer>

<script src="/js/cadastrarAcai.js"></script>

        crossorigin="anonymous">

</body>
</html>
